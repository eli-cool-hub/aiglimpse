<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="New Framework Accelerates Development of Multimodal AI Models">
  <defs>
    <linearGradient id="bg" gradientTransform="rotate(27)" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0a1f"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d1b4ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#a06bff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d2e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff4d2e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#fafaf7" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="488" cy="230" r="312" fill="url(#blob1)"/>
  <circle cx="646" cy="269" r="307" fill="url(#blob2)"/>
  <g font-family="'Inter', -apple-system, system-ui, sans-serif">
    <text x="64" y="80" font-size="14" font-weight="700" letter-spacing="4" fill="#a06bff">RESEARCH</text>
  </g>
  <g font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-weight="700" letter-spacing="-1.5">
    <text x="64" y="362" font-size="56" fill="#fafaf7"><tspan x="64" dy="0">New Framework Accelerates</tspan><tspan x="64" dy="64">Development of Multimodal AI</tspan><tspan x="64" dy="64">Models</tspan></text>
  </g>
  <g transform="translate(970, 570)" font-family="'Fraunces', Georgia, serif">
    <circle cx="20" cy="-26" r="6" fill="#ff4d2e"/>
    <text x="0" y="0" font-size="32" font-weight="700" fill="#fafaf7" letter-spacing="-0.8">A&#x131; Glimpse</text>
  </g>
