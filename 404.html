<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | AI Glimpse</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <div id="site-header-slot"></div>
  <main>
    <section style="padding: var(--space-10) 0; text-align: center;">
      <div class="container container--narrow">
        <p class="eyebrow eyebrow--accent" style="margin-bottom: var(--space-4);">404</p>
        <h1 style="font-size: clamp(2.5rem, 8vw, 6rem); margin-bottom: var(--space-5); letter-spacing: -0.04em;">This story doesn't exist.</h1>
        <p style="font-size: var(--text-md); color: var(--color-ink-muted); max-width: 48ch; margin: 0 auto var(--space-6);">The page you're looking for has moved, been deleted, or never existed. Head back to the homepage to find the latest AI news.</p>
        <a href="/" class="btn btn--primary btn--lg">Back to homepage</a>
      </div>
    </section>
  </main>
  <div id="site-footer-slot"></div>
  <script src="/js/chrome.js"></script>
</body>
</html>
