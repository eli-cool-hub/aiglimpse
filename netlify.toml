[build]
  publish = "."

# Force HTTPS + canonical domain
[[redirects]]
  from = "https://www.aiglimpse.ai/*"
  to = "https://aiglimpse.ai/:splat"
  status = 301
  force = true

# Pretty URLs (optional, remove if you prefer .html)
[[redirects]]
  from = "/articles/*/"
  to = "/articles/:splat.html"
  status = 200

[[redirects]]
  from = "/search"
  to = "/search.html"
  status = 200

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security + performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# CSS + JS get a short cache so design fixes go live within an hour for
# returning readers. Articles change often anyway, the heavy bytes are
# images, which keep the long immutable cache below.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML, short cache for fast updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Sitemap & RSS, short cache so search engines see fresh data
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=600"

# Client-side search index, refreshed on every publish run
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=600"

# AdSense crawler must see ads.txt as text/plain
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# IndexNow key file must be plain text so Bing/Yandex bots verify ownership
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
