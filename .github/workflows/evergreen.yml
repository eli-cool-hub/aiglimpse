name: Weekly evergreen explainer

# Publishes one long-form SEO guide per week from the queued topic catalogue.
# First unpublished topic in scripts/lib/evergreen-topics.mjs wins.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Single topic slug (overrides weekly pick)"
        required: false
        type: string
      force:
        description: "Rewrite even if already published"
        required: false
        default: false
        type: boolean
  schedule:
    # Wednesdays 06:00 UTC — after Monday image heal, before mid-week news peak
    - cron: '0 6 * * 3'

concurrency:
  group: aiglimpse-content-push
  cancel-in-progress: false

jobs:
  evergreen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-fund --no-audit

      - name: Generate weekly evergreen explainer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          SITE_URL: https://aiglimpse.ai
        run: |
          ARGS="--weekly"
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="--slug ${{ inputs.slug }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/generate-evergreen.mjs $ARGS

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ data/ sitemap.xml rss.xml index.html categories/ guides.html images/articles/
          if git diff --staged --quiet; then
            echo "No new evergreen content to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "📚 Evergreen: weekly explainer $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
