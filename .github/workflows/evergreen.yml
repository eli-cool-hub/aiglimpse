name: Generate Evergreen Explainers

# Manual-only. We don't auto-run this because evergreens are written rarely
# and reviewed before being added to EVERGREEN_TOPICS. Trigger from the
# Actions tab when a new topic is queued.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Single topic slug to generate (leave blank to publish all unpublished topics)"
        required: false
        type: string
      force:
        description: "Rewrite even if the topic was already published"
        required: false
        default: false
        type: boolean

jobs:
  evergreen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Generate evergreen pieces
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SITE_URL: https://aiglimpse.ai
        run: |
          ARGS=""
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ inputs.slug }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/generate-evergreen.mjs $ARGS

      - name: Commit and push
        id: commit
        run: |
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ data/ sitemap.xml rss.xml index.html categories/ images/articles/
          if git diff --staged --quiet; then
            echo "No new evergreen content to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "📚 Evergreen: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy --prod --dir . --message "Evergreen $(date -u +'%Y-%m-%d %H:%M UTC')"
