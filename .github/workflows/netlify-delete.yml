name: "Netlify - Delete Site (one-shot)"

# Tears down the Netlify site now that Cloudflare Pages is fully live on
# https://aiglimpse.ai. Requires a manual confirm input so a stray click
# in the Actions tab cannot wipe the site without intent.
#
# After this succeeds it is safe to also remove NETLIFY_AUTH_TOKEN and
# NETLIFY_SITE_ID from repository secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete" to actually delete the Netlify site (anything else aborts)'
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "delete" ]; then
            echo "::error::Confirmation string was '${{ inputs.confirm }}', expected 'delete'. Aborting."
            exit 1
          fi
          echo "Confirmation OK"

      - name: Show the site before deletion
        run: |
          curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" \
            | jq '{name, url, custom_domain, account_name, created_at, updated_at}' \
            || echo "Could not fetch site detail (token may already be revoked)."

      - name: Delete the Netlify site
        run: |
          CODE=$(curl -sS -o /tmp/del.out -w "%{http_code}" \
            -X DELETE \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          echo "HTTP $CODE"
          cat /tmp/del.out || true
          if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then
            echo "::error::Delete returned HTTP $CODE"
            exit 1
          fi
          echo "Netlify site $NETLIFY_SITE_ID deleted."

      - name: Confirm by reading it back
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          echo "Post-delete GET returned HTTP $CODE (expected 404)."
          if [ "$CODE" = "404" ]; then
            echo "Confirmed: site no longer exists."
          else
            echo "::warning::Unexpected post-delete status; please verify in Netlify UI."
          fi
