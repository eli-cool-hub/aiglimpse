name: Heal Inline Images

# Manual-only. Adds inline Pexels photos to existing articles that were
# published before inline-image support landed (or after a heal-worthy
# CSS or template change). Idempotent, safe to re-run.
on:
  workflow_dispatch:

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Heal inline images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SITE_URL: https://aiglimpse.ai
        run: node scripts/heal-inline-images.mjs

      - name: Commit and push
        id: commit
        run: |
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ images/articles/
          if git diff --staged --quiet; then
            echo "No articles needed healing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🩹 Heal: add inline images to existing articles ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
