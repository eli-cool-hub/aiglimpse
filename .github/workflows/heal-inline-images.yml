name: Heal Inline Images

# Manual-only. Adds inline Pexels photos to existing articles that were
# published before inline-image support landed (or after a heal-worthy
# CSS or template change). Idempotent, safe to re-run.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Replace existing inline images (recommended after query improvements)
        type: boolean
        default: true
  schedule:
    # Sundays at 04:15 UTC - quiet hour, before Monday morning publishing.
    - cron: '15 4 * * 0'

concurrency:
  group: aiglimpse-content-push
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Heal inline images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SITE_URL: https://aiglimpse.ai
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS="--force"
          fi
          node scripts/heal-inline-images.mjs $ARGS

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ images/articles/
          if git diff --staged --quiet; then
            echo "No articles needed healing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🩹 Heal: add inline images to existing articles ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
