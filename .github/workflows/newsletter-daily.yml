name: Send AI Glimpse Daily newsletter

# Collect-only mode: signup + verify run on Cloudflare Pages. Daily digests are
# OFF until you manually run this workflow with send_digest=true.

on:
  workflow_dispatch:
    inputs:
      send_digest:
        description: Send today's digest to all verified subscribers
        type: boolean
        default: false

concurrency:
  group: aiglimpse-newsletter-daily
  cancel-in-progress: false

jobs:
  send:
    if: github.event.inputs.send_digest == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Resend secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::error::RESEND_API_KEY is not set. Add it in GitHub → Settings → Secrets → Actions."
            missing=1
          fi
          if [ -z "$RESEND_FROM_EMAIL" ]; then
            echo "::error::RESEND_FROM_EMAIL is not set (e.g. 'AI Glimpse <daily@aiglimpse.ai>')."
            missing=1
          fi
          if [ -z "$RESEND_SEGMENT_ID" ] && [ -z "$RESEND_AUDIENCE_ID" ]; then
            echo "::error::RESEND_SEGMENT_ID (or legacy RESEND_AUDIENCE_ID) is not set."
            echo "Run: RESEND_API_KEY=re_xxx node scripts/setup-resend-segment.mjs"
            missing=1
          fi
          exit $missing

      - name: Send digest via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          SITE_URL: https://aiglimpse.ai
          NEWSLETTER_SEND_ENABLED: 'true'
        run: node scripts/send-daily-newsletter.mjs

      - name: Commit send state
        run: |
          set -euo pipefail
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add data/newsletter-state.json
          if git diff --staged --quiet; then
            echo "No state change"
          else
            git commit -m "chore(newsletter): daily send $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash origin main
            git push
          fi

  collect-only:
    if: github.event.inputs.send_digest != true
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Newsletter sends are disabled — collect-only mode."
          echo "Subscribers sign up via the site; no daily digest is sent."
          echo "When ready to launch, re-run this workflow with send_digest=true."
