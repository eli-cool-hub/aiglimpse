name: "Cloudflare - Push dashboard secrets (one-shot)"

# Pushes DASHBOARD_USER and DASHBOARD_PASS GitHub secrets into the
# Cloudflare Pages project so the Basic-Auth middleware can read them
# from context.env at request time. Re-run any time the credentials
# change.

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Push DASHBOARD_USER
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.DASHBOARD_USER }}
        run: printf '%s' "$VAL" | npx wrangler@latest pages secret put DASHBOARD_USER --project-name=aiglimpse

      - name: Push DASHBOARD_PASS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAL: ${{ secrets.DASHBOARD_PASS }}
        run: printf '%s' "$VAL" | npx wrangler@latest pages secret put DASHBOARD_PASS --project-name=aiglimpse

      - name: Redeploy so middleware can see the new secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
