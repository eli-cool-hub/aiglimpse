name: Fetch AI News

on:
  schedule:
    # Every 2 hours, top of the hour. Steady drip, not bursts.
    # Google prefers consistent newsroom cadence over flooding for new domains.
    - cron: '0 */2 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Fetch and publish articles
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SITE_URL: https://aiglimpse.ai
          # Steady drip: 2 articles per run, max 1 per category per run.
          # Times 12 runs/day = ~24 articles/day, balanced across topics.
          MAX_PER_RUN: '2'
          PER_CATEGORY_CAP: '1'
        run: npm run fetch

      - name: Commit and push
        id: commit
        run: |
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ data/ sitemap.xml rss.xml index.html categories/ images/articles/
          if git diff --staged --quiet; then
            echo "No new articles to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 Auto-publish: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true' && env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@latest deploy --prod --dir . --message "Auto-publish $(date -u +'%Y-%m-%d %H:%M UTC')"
