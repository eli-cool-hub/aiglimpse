name: Fetch AI News

on:
  schedule:
    # Every 4 hours. Google has indexed ~283 URLs and stopped — publishing
    # ~12 similar news pieces/day is widening the unindexed backlog. Cap at
    # 1/run × 6 runs = ~6/day until coverage climbs.
    - cron: '0 */4 * * *'
  workflow_dispatch: # allows manual trigger from GitHub UI

concurrency:
  group: aiglimpse-content-push
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Fetch and publish articles
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          HASHNODE_TOKEN: ${{ secrets.HASHNODE_TOKEN }}
          SITE_URL: https://aiglimpse.ai
          # 1 article × 6 runs/day = ~6/day while Google's index is frozen.
          # Cap 1 per category so ethics / industry / robotics still rotate.
          MAX_PER_RUN: '1'
          PER_CATEGORY_CAP: '1'
        run: npm run fetch

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ data/ sitemap.xml sitemap-pages.xml sitemap-articles.xml sitemap-news.xml rss.xml index.html categories/ images/articles/ llms.txt llms-full.txt search-index.json
          if git diff --staged --quiet; then
            echo "No new articles to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🤖 Auto-publish: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Cloudflare Pages: 500 deploys/month free, no per-deploy credit cost.
      # Direct upload via wrangler keeps the same architecture we had on
      # Netlify (cron commits to git, then pushes the static site to the host)
      # but without the 15-credits-per-deploy ceiling.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
