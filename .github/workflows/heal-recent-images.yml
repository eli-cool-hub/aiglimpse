name: Heal recent article images

# Re-picks hero (+ inline) photos for articles published in the last ~14 days
# using improved Pexels relevance filters (blocks coffee, pets, etc.).

on:
  workflow_dispatch:
    inputs:
      days:
        description: Look back N days
        default: '14'
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: aiglimpse-content-push
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-fund --no-audit

      - name: Heal recent heroes and inline images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          node scripts/heal-recent-images.mjs --days "${{ github.event.inputs.days || '14' }}"
          node scripts/heal-images.mjs --svg

      - name: Commit and push
        id: commit
        run: |
          set -euo pipefail
          git config user.name "AI Glimpse Bot"
          git config user.email "bot@aiglimpse.ai"
          git add articles/ data/published.json images/articles/ index.html categories/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "🖼 Heal recent article images ($(date -u +'%Y-%m-%d'))"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
