name: Deploy to Cloudflare Pages

# Manual deploy of whatever currently lives on main. Useful for:
#   - the very first deploy (auto-creates the Pages project)
#   - CSS / template-only changes that the cron would otherwise skip
#     because nothing in articles/ changed
#   - re-running a failed deploy without waiting for the next cron tick
#
# The scheduled fetch-news, evergreen, and heal-inline-images workflows
# all deploy on their own when they produce a content commit, so this
# workflow is intentionally manual-only.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # First-run safety: try to create the Pages project. Wrangler 3
          # exits non-zero when the project already exists; the `|| true`
          # makes the step idempotent so every subsequent deploy still
          # passes this gate without complaint.
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
