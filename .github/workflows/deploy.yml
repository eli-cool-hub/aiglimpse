name: Deploy to Cloudflare Pages

# Manual deploy of whatever currently lives on main. Also runs automatically
# when dashboard, middleware, or site chrome changes — those paths are not
# picked up by fetch-news deploy (articles-only commit gate).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard.html'
      - 'scripts/templates/dashboard.html'
      - 'data/seo-actions.json'
      - 'data/seo-history.json'
      - 'reports/seo/**'
      - 'functions/**'
      - 'css/**'
      - 'js/**'
      - 'pages/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'sitemap-*.xml'
      - 'data/affiliates.json'
      - 'data/newsletter-sponsor.json'
      - '_headers'
      - '_redirects'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # First-run safety: try to create the Pages project. Wrangler 3
          # exits non-zero when the project already exists; the `|| true`
          # makes the step idempotent so every subsequent deploy still
          # passes this gate without complaint.
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
