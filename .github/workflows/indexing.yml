name: Submit URLs for indexing

# Refreshes sitemap index + News/article/page sitemaps, resubmits them to
# Google Search Console, pings IndexNow, and inspects a prioritized slice of
# URLs (hubs, evergreen, unknown, newest). A single Inspection timeout must
# not fail the job — the report is always committed.

on:
  workflow_dispatch:
  schedule:
    # Daily at 08:15 UTC — after SEO report (05:30 / backup 07:30) and before fetch-news.
    - cron: '15 8 * * *'

permissions:
  contents: write

jobs:
  indexing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Submit sitemaps and inspect URLs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: https://aiglimpse.ai
        run: node scripts/submit-indexing.mjs

      - name: Commit indexing report
        id: commit
        run: |
          set -euo pipefail
          git config user.name "aiglimpse-bot"
          git config user.email "bot@aiglimpse.ai"
          git add sitemap.xml sitemap-pages.xml sitemap-articles.xml sitemap-news.xml reports/indexing/ data/indexing-status.json
          if git diff --staged --quiet; then
            echo "No indexing report changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(indexing): daily sitemap + status $(date -u +'%Y-%m-%d')"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git pull --rebase --autostash origin main
          git push

      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: wrangler pages project create aiglimpse --production-branch=main || true
          command: pages deploy . --project-name=aiglimpse --branch=main --commit-dirty=true
